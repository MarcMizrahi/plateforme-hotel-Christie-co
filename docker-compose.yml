# Phase 0 — DEPLOY.md §3-4. Socle minimal : postgres + app + caddy (HTTPS auto).
# Redis/Meilisearch/MinIO/Mailpit arrivent en Phase 1 (CLAUDE.md §3) — pas ici.
#
# L'image applicative n'est PAS construite sur le serveur : elle est produite par la CI
# (.github/workflows/main.yml) et publiée sur GHCR. Le serveur se contente de `pull`.
# Renseigner APP_IMAGE dans .env.docker (ex. ghcr.io/marcmizrahi/plateforme-hotel-christie-co:latest).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Valeur de repli : sans elle, un `docker compose up -d db` (usage courant en local,
    # où seule la base est utile) échoue tant qu'APP_IMAGE n'est pas défini.
    image: ${APP_IMAGE:-ghcr.io/marcmizrahi/plateforme-hotel-christie-co:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
