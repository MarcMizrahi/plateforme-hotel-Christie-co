# CI : qualité + publication de l'image applicative sur GHCR.
#
# Cible de déploiement : VM Oracle Cloud Always Free (Ampere A1 = arm64), cf. DEPLOY.md §3-ter
# et DECISIONS.md DP15. L'image est donc construite pour linux/arm64, nativement, sur les
# runners ARM de GitHub — gratuits et illimités sur un dépôt public.
#
# Le déploiement lui-même n'est PAS fait ici : la base Postgres tourne dans la VM et n'est
# pas joignable depuis GitHub Actions. Le serveur tire l'image et applique les migrations
# via ./deploy.sh (DEPLOY.md §7).

name: CI & image (GHCR)

on:
  push:
    branches: [main]
    tags: ["deploy-*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  image:
    name: Build & push image arm64 (GHCR)
    needs: quality
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
