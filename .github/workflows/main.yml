# .github/workflows/deploy-azure.yml
# Remplace build-artifact.yml : build de l'artefact (GHCR) PUIS déploiement Azure Web App.
# Prérequis (une seule fois, cf. DEPLOY-AZURE.md) :
#   - secrets GitHub : AZURE_WEBAPP_PUBLISH_PROFILE, DATABASE_URL
#   - variable GitHub : AZURE_WEBAPP_NAME

name: Deploy to Azure Web App

on:
  push:
    branches: [main]
    tags: ["deploy-*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # ne jamais annuler un déploiement en cours

jobs:
  quality:
    name: Lint, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  image:
    name: Build & push artifact (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image_sha: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Migrations Prisma (avant bascule)
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma migrate deploy
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # URL Azure PostgreSQL, sslmode=require

  deploy:
    name: Déploiement Web App
    needs: [image, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ github.repository }}:${{ github.sha }}   # tag immuable, pas :latest

      - name: Vérification santé post-déploiement
        run: |
          echo "Attente du démarrage..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health" || true)
            [ "$code" = "200" ] && echo "OK — /api/health = 200" && exit 0
            sleep 10
          done
          echo "::error::Le health check ne répond pas après 5 min" && exit 1
